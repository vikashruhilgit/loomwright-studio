name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The job is named `ci` on purpose: it is the required status check on `main`
# (see the branch protection rule). Renaming it silently disables the gate.
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Docs are the product until phase 1 lands. This gate is deterministic and
      # dependency-free: links resolve, decision numbers are unique, CLAUDE.md's
      # table points at real files.
      - name: Check docs
        run: bash scripts/check-docs.sh

      # Root TypeScript steps: dormant. They activate only if a package.json is
      # ever added at the repo root; there is none (the kernel lives in kernel/),
      # so they are skipped. The kernel steps further down key on
      # kernel/package.json instead.
      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Lint and typecheck
        if: hashFiles('package.json') != ''
        run: |
          npm run --if-present lint
          npm run --if-present typecheck

      - name: Test
        if: hashFiles('package.json') != ''
        run: npm test

      # Kernel (kernel/): install, typecheck, unit tests, build and a --version
      # smoke run. Any failure fails the `ci` job. Unit tests never call the
      # Agent SDK or a model, so CI needs no token.
      - name: Set up Node (kernel)
        if: hashFiles('kernel/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kernel/package-lock.json

      - name: Install (kernel)
        if: hashFiles('kernel/package.json') != ''
        working-directory: kernel
        run: npm ci

      - name: Typecheck (kernel)
        if: hashFiles('kernel/package.json') != ''
        working-directory: kernel
        run: npm run typecheck

      - name: Test (kernel)
        if: hashFiles('kernel/package.json') != ''
        working-directory: kernel
        run: npm test

      # tsconfig.build.json (rootDir src, include src) is stricter than the
      # typecheck tsconfig, so typecheck + test can pass while the build fails
      # (e.g. src importing from test/). Build for real, then run the entry point.
      - name: Build (kernel)
        if: hashFiles('kernel/package.json') != ''
        working-directory: kernel
        run: npm run build

      - name: Smoke --version (kernel)
        if: hashFiles('kernel/package.json') != ''
        working-directory: kernel
        run: |
          expected="$(node -p "require('./package.json').version")"
          actual="$(node dist/daemon.js --version)"
          if [ "$actual" != "$expected" ]; then
            echo "daemon --version printed '$actual', expected '$expected'" >&2
            exit 1
          fi

  # The desktop app (app/): install, typecheck, unit tests, build, then the
  # Playwright Electron smoke under xvfb. A sibling of `ci`, not a step in it,
  # so the required check keeps its name. Most specs use the fixture kernel;
  # one (e2e/phase-5-exit.spec.ts) runs a real kernel in-process, in the
  # Playwright worker, with stand-in sessions, so the job installs kernel/ too.
  # Still no token, no Keychain and no real SDK.
  app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node (app)
        if: hashFiles('app/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            kernel/package-lock.json

      - name: Install (app)
        if: hashFiles('app/package.json') != ''
        working-directory: app
        run: npm ci

      # The real-kernel e2e (and the app typecheck, which covers e2e/) imports
      # kernel/src and kernel/test, whose packages resolve from kernel/node_modules.
      - name: Install (kernel, for app e2e)
        if: hashFiles('app/package.json') != ''
        working-directory: kernel
        run: npm ci

      - name: Typecheck (app)
        if: hashFiles('app/package.json') != ''
        working-directory: app
        run: npm run typecheck

      - name: Test (app)
        if: hashFiles('app/package.json') != ''
        working-directory: app
        run: npm test

      - name: Build (app)
        if: hashFiles('app/package.json') != ''
        working-directory: app
        run: npm run build

      # Electron 44 downloads its binary on first use; fetch it up front so a
      # download failure reads as one, not as a failed smoke.
      - name: Download Electron (app)
        if: hashFiles('app/package.json') != ''
        working-directory: app
        run: node node_modules/electron/install.js

      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's
      # sandbox needs; the window keeps `sandbox: true`, so allow them rather
      # than run Electron with --no-sandbox.
      - name: Smoke (app, Playwright Electron under xvfb)
        if: hashFiles('app/package.json') != ''
        working-directory: app
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          if ! command -v xvfb-run >/dev/null; then sudo apt-get update && sudo apt-get install -y xvfb; fi
          xvfb-run --auto-servernum npm run e2e
