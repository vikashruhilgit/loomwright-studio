name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Collapse rapid-fire pushes to the same PR into a single review of the latest
# state: a new run cancels any in-flight review for the same PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so the reviewer can check claims against the base with
          # `git show HEAD^1:<path>` instead of taking the author's word for it.
          fetch-depth: 0

      # Stamped BEFORE the reviewer runs so the posted-comment assertion below can tell
      # THIS run's comment from one left by an earlier run on the same PR.
      - name: Stamp run start
        id: stamp
        run: echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        # Pinned to v1.0.231's commit SHA, the same pin as vikashruhilgit/loomwright.
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            PROJECT CONTEXT:
            - Loomwright Studio: a macOS desktop app (Electron shell, React UI) for an
              always-available AI partner, "Wright", built on @anthropic-ai/claude-agent-sdk
              and the Loomwright plugin. TypeScript throughout.
            - Read CLAUDE.md first. Its nine invariants are the review rubric: mechanism vs
              policy, the LLM never owns its lifecycle, the fixed safety kernel, Loomwright's
              merge gate, optional integrations, API-key-first auth with no claude.ai login,
              branding ("Wright, powered by Claude", never "Claude Code"), memory as
              inspectable files, no role presets and token (not dollar) limits.
            - docs/DECISIONS.md is settled: a PR that contradicts a decision must add a new
              numbered decision superseding it, never silently edit or ignore one.
            - docs/OPEN_QUESTIONS.md lists claims marked NEEDS VERIFICATION. Code that builds
              on one without a recorded probe is a finding.
            - Until phase 1 lands the repo is docs and design (docs/, docs/design/). Review
              docs for contradictions between files (VISION, DECISIONS, ARCHITECTURE, UI,
              ROADMAP, DESIGN) and for count/version/path drift.

            Please review this pull request for:
            - Invariant violations (cite the invariant number)
            - Correctness and failure modes in kernel code: state on disk survives kill -9,
              no LLM-owned lifecycle, fail-closed on budget/cap, untrusted input as data
            - Security: prompt-injection surfaces (PR bodies, comments, tickets reaching a
              model as instructions), secrets, permission policy widening
            - Cross-reference precision drift: a "see X" / file path / decision number that
              no longer points where it claims
            - Tests that assert the shape the code chose rather than the documented contract

            This is your own independent checklist as a reviewer — apply your own judgment;
            do not try to match or converge with any other reviewer's findings.

            On a large PR, `gh pr diff` alone will not fit and is not enough to judge
            anything. Read the changed files directly, and compare a file against its
            base version with `git show HEAD^1:<path>` — on a pull_request event CI
            checks out the PR's merge commit, whose FIRST parent is the base branch tip.
            You have the full history and the working tree.

            Two command shapes are REFUSED by the tool-permission layer no matter what
            the allowlist says, so do not reach for them — each attempt costs a turn and
            returns nothing:
              * COMMAND SUBSTITUTION. `git diff $(git merge-base HEAD origin/main)` and
                `git show "$(...)":<path>` are denied on the substitution itself. Use
                `HEAD^1`, which needs no substitution and no remote-tracking ref.
              * `git fetch`. The checkout is already complete (`fetch-depth: 0` above).
              * SHELL LOOPS. `for f in a b c; do ...; done` is refused as a construct.
                Expand it: one call per file, or a single `ls`/`grep` that covers them.
            Chaining allowed commands with `;` or `|` IS permitted.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on
            the PR. Posting is not optional and it is the LAST thing you do: if you run
            low on turns, or could not examine everything you wanted to, post what you
            DO have plus an explicit note about what you could not cover. A run that
            ends without a posted comment is indistinguishable from no review at all.

            EVERY completed run posts exactly one comment — including when you find
            nothing. In that case post a short comment that starts with
            `Reviewed <sha>: no new findings` (use `git rev-parse HEAD^2` for the PR
            head sha — HEAD is the merge commit, its SECOND parent is the PR tip) and
            then, in a sentence or two, say what you examined and, if this is a
            re-review, confirm which earlier findings the new commits addressed. A
            completion check on this workflow only counts comments longer than 200
            characters as a posted review, so a one-line "no new findings" still
            registers as silence.

            The LAST line of EVERY comment you post — finding-bearing and no-findings
            alike — is exactly this line, verbatim, on a line of its own:
            execution: none — static review; this reviewer cannot run code in CI, so runtime behavior is NOT verified by this review.

          # --allowed-tools REPLACES the action's defaults. This list is loomwright's,
          # tuned there against real silent runs: no Write/Edit, no bare Bash, no
          # find/awk/xargs/sed (each has an exec or in-place-write primitive), read-only
          # git plus the gh commands needed to read the PR and post the comment.
          # Kept on ONE line: a YAML folded scalar would inject a leading space into
          # every wrapped tool name.
          claude_args: '--allowed-tools "Read,Grep,Glob,Task,TodoWrite,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git cat-file:*),Bash(git blame:*),Bash(git ls-files:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(git status:*),Bash(jq:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(sort:*),Bash(uniq:*),Bash(cut:*),Bash(tr:*),Bash(diff:*),Bash(ls:*),Bash(grep:*),Bash(cmp:*),Bash(comm:*),Bash(basename:*),Bash(dirname:*),Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

      # A run that ends without a posted comment is indistinguishable from no
      # review at all: the action exits is_error:false and the check goes green
      # whether or not a review was delivered. This step makes that visible. It is
      # deliberately NOT a required check (branch protection requires `ci` only),
      # so a red mark reports "not actually reviewed" without blocking the merge.
      # Only comments by claude[bot], newer than this run's stamp, and longer than
      # 200 characters count. No always(): the step must not run on cancellation.
      - name: Assert a review was actually posted
        if: steps.claude-review.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.stamp.outputs.since }}
        run: |
          set -uo pipefail
          if [ -z "${SINCE}" ]; then
            echo "::warning::run-start stamp is empty; the anti-replay filter would accept a comment of any age, so this assertion is skipped rather than run vacuously."
            exit 0
          fi
          changed="$(git diff --name-only HEAD^1 HEAD 2>/dev/null || true)"
          workflow_touched=0
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/*) workflow_touched=1 ;;
            esac
          done <<< "$changed"
          if [ "$workflow_touched" -eq 1 ]; then
            echo "::notice::PR modifies a workflow file; claude-code-action self-skips these, so there is no review to assert. Validate this workflow on the next NON-workflow PR."
            exit 0
          fi
          if ! ids="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                        --paginate --jq \
                        ".[] | select(.user.login == \"claude[bot]\") | select(.created_at >= \"${SINCE}\") | select(.body | length > 200) | .id" \
                      2>/dev/null)"; then
            echo "::warning::could not read PR comments to verify a review was posted; not failing on an unreadable check"
            exit 0
          fi
          posted="$(printf '%s' "$ids" | grep -c . || true)"
          if [ "${posted:-0}" -gt 0 ]; then
            echo "review posted: $posted substantive claude[bot] comment(s) since ${SINCE}"
            exit 0
          fi
          echo "::error::claude-review ran to completion but posted NO comment on PR #${PR_NUMBER}. Only claude[bot] comments newer than ${SINCE} and longer than 200 characters count. The usual cause is tool-permission starvation (--allowed-tools replaces the defaults); compare the attempted commands against the allowlist. Do not trust the green check."
          exit 1
