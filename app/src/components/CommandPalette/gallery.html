<!doctype html>
<!--
  E2E-only gallery for the ⌘K palette, served by the Vite dev server that
  app/e2e/components.palette.spec.ts starts. `vite build` builds index.html
  only, so this page never ships. `?theme=light|dark` sets `data-theme`.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CommandPalette gallery</title>
    <style>
      html,
      body {
        background: var(--ground);
      }
      .gallery {
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
        padding: var(--space-6);
        color: var(--ink);
      }
      .gallery h1 {
        margin: 0;
        font-size: var(--type-title-1-size);
        line-height: var(--type-title-1-line);
        font-weight: var(--type-title-1-weight);
      }
      .gallery p,
      .gallery output {
        margin: 0;
        color: var(--ink-secondary);
      }
      .gallery button {
        align-self: flex-start;
        height: var(--control-height);
        padding: 0 var(--space-3);
        border: 1px solid var(--hairline);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--ink);
        font: inherit;
      }
      .gallery-confirm {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--overlay);
      }
      .gallery-confirm > div {
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
        width: 360px;
        padding: var(--space-5);
        border-radius: var(--radius-lg);
        background: var(--surface-raised);
        box-shadow: var(--shadow-3);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./gallery.tsx"></script>
  </body>
</html>
