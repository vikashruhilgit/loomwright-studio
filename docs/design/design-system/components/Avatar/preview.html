<!-- @dsCard group="Status" height=330 subtitle="Sea creatures stitched from their own thread; the loose thread carries the state; Wright is the crowned whale" -->
<style>
  body{margin:0;padding:16px;background:var(--ground);font-family:var(--font-sans);color:var(--ink);font-size:13px;line-height:18px}
  .row{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
  .row>div{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink-secondary);font-size:11px}
/* Loom avatars: a sea creature stitched from thread per crew member (Wright is the crowned whale). No face beyond a knot for the eye: the thread is the actor. Layers: drift (whole), rig (body from its base), wind (the winding), tail (the loose thread) */
.bot{display:inline-grid;place-items:center;width:var(--s,32px);height:var(--s,32px);flex:none;position:relative}
.bot svg{width:100%;height:100%;overflow:visible;display:block}
.bot .drift{transform-origin:16px 16px}
.bot .rig{transform-origin:16px 29px}
.bot .fill{fill:var(--bot,var(--accent));opacity:.28}
.bot .st{fill:none;stroke:var(--bot,var(--accent));stroke-width:1.6;stroke-dasharray:2.6 1.5;stroke-linecap:round;stroke-linejoin:round}
.bot .ln{fill:none;stroke:var(--bot,var(--accent));stroke-width:1.2;stroke-dasharray:1.8 1.4;stroke-linecap:round;opacity:.85}
.bot .knot{fill:var(--bot,var(--accent))}
.bot.working .st,.bot.working .ln{animation:run 1.2s linear infinite}
.bot .frame{fill:var(--ink-tertiary)}
.bot .thread{fill:var(--bot,var(--accent))}
.bot .stripe{stroke:var(--ground);stroke-width:1.1;fill:none;opacity:.55}
.bot .t{stroke:var(--bot,var(--accent));stroke-width:1.9;stroke-linecap:round;fill:none;display:none}
.bot .t-idle{display:block}
.bot .ring{position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--attention);opacity:0;pointer-events:none}
/* the thread border: a running stitch in the agent's hue around every avatar; it runs while working */
.bot .stitch{fill:none;stroke:var(--bot,var(--accent));stroke-width:1.2;stroke-dasharray:2.4 2.6;stroke-linecap:round;opacity:.45;transform-origin:16px 16px}
.bot.working .stitch{animation:run 1.6s linear infinite}
.bot.parked .stitch{stroke-dasharray:1 4;opacity:.5}
.bot.danger .stitch{stroke-dasharray:6 10;opacity:.6}
.bot.done .stitch{stroke-dasharray:none;opacity:.9}
.bot .crown{fill:var(--bot,var(--accent));stroke:var(--ground);stroke-width:.8;stroke-linejoin:round}
@keyframes run{to{stroke-dashoffset:-10}}
/* hover: a nod, and the thread flicks */
.bot:hover .rig{animation:nod .5s cubic-bezier(.3,0,.2,1) 1!important}
/* idle: calm. floats in a slow swirl; the loose thread sways */
.bot.idle .drift{animation:swirl 7s ease-in-out infinite;animation-delay:var(--seed,0s)}
.bot.idle .tail{animation:sway 3s ease-in-out infinite alternate;animation-delay:var(--seed,0s)}
/* working: the thread winds on, the creature leans into the work, the loose end flutters */
.bot.working .wind{animation:winding .5s linear infinite}
.bot.working .rig{animation:lean 1.2s ease-in-out infinite alternate}
.bot.working .tail{animation:flutter .35s ease-in-out infinite alternate}
/* waiting on you: the thread rises toward you in a loop; the creature hops; amber ring when it lands */
.bot.waiting .t-idle{display:none}.bot.waiting .t-up{display:block}
.bot.waiting .rig{animation:hop 2.6s cubic-bezier(.3,0,.2,1) infinite}
.bot.waiting .tail{animation:beckon 2.6s ease-in-out infinite}
.bot.waiting .ring{animation:ring 2.6s ease-out infinite}
/* paused at cap: the thread hangs slack, the creature settles, dimmed */
.bot.parked{opacity:.72}
.bot.parked .t-idle{display:none}.bot.parked .t-slack{display:block}
.bot.parked .rig{animation:sink 4.5s ease-in-out infinite}
/* killed / failed: the thread is cut; the creature tips */
.bot.danger .t-idle{display:none}.bot.danger .t-cut,.bot.danger .t-cut2{display:block}
.bot.danger .rig{animation:tip .6s cubic-bezier(.36,.07,.19,.97) 1 forwards}
/* done: the thread ties into a bow; one spin with overshoot */
.bot.done .t-idle{display:none}.bot.done .t-bow{display:block}
.bot.done .rig{animation:spin 1s cubic-bezier(.34,1.4,.64,1) 1}
.bot.done .drift{animation:orbit 1s cubic-bezier(.3,0,.2,1) 1}
@keyframes swirl{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(1.4px,-1px) rotate(3deg)}50%{transform:translate(0,-2px) rotate(0)}75%{transform:translate(-1.4px,-1px) rotate(-3deg)}}
@keyframes sway{from{transform:rotate(-14deg)}to{transform:rotate(12deg)}}
@keyframes winding{from{transform:translateY(0)}to{transform:translateY(3px)}}
@keyframes lean{from{transform:rotate(-3deg) scale(1,1)}to{transform:rotate(3deg) scale(1.02,.98)}}
@keyframes flutter{from{transform:rotate(-6deg)}to{transform:rotate(18deg)}}
@keyframes hop{0%,58%,100%{transform:translateY(0) scale(1,1)}64%{transform:translateY(1.5px) scale(1.12,.86)}73%{transform:translateY(-7px) scale(.94,1.1)}80%{transform:translateY(-3px) scale(.97,1.04)}85%{transform:translateY(0) scale(1.08,.92)}92%{transform:scale(.99,1.01)}}
@keyframes beckon{0%,55%,100%{transform:rotate(0)}70%{transform:rotate(-18deg)}85%{transform:rotate(8deg)}}
@keyframes nod{0%{transform:rotate(0)}30%{transform:rotate(-8deg) translateY(-2px)}70%{transform:rotate(4deg)}100%{transform:rotate(0)}}
@keyframes ring{0%,80%{opacity:0;transform:scale(.8)}83%{opacity:.75;transform:scale(.86)}100%{opacity:0;transform:scale(1.35)}}
@keyframes sink{0%,100%{transform:translateY(1px) scale(1.04,.96)}50%{transform:translateY(1.4px) scale(1.05,.95)}}
@keyframes tip{0%{transform:rotate(0)}20%{transform:rotate(-6deg) translateX(-2px)}40%{transform:rotate(6deg) translateX(2px)}100%{transform:rotate(22deg) translateY(1px)}}
@keyframes orbit{0%{transform:translate(0,0)}25%{transform:translate(3px,-3px)}50%{transform:translate(0,-5px)}75%{transform:translate(-3px,-3px)}100%{transform:translate(0,0)}}
@keyframes spin{0%{transform:rotate(0) scale(1)}45%{transform:rotate(380deg) scale(1.08)}100%{transform:rotate(360deg) scale(1)}}
@media (prefers-reduced-motion:reduce){.bot .drift,.bot .rig,.bot .wind,.bot .tail,.bot .ring{animation:none!important}.bot.waiting .ring{opacity:.7}}

</style>
<div class="row" id="states"></div>
<div class="row" id="shapes"></div>
<div class="row" id="sizes"></div>
<script>
  const esc=s=>String(s); const stateWord={idle:'idle',working:'working',waiting:'waiting on you',parked:'paused at cap',done:'done',danger:'killed'}; const agentState=()=>'idle';
const SHAPES={
  whale:{body:'<ellipse class="fill" cx="18" cy="17" rx="10" ry="7"/><path class="fill" d="M9 17c-3-1-5-3-6-6 0 4 0 8 0 12 1-3 3-5 6-6z"/><ellipse class="st" cx="18" cy="17" rx="10" ry="7"/><path class="st" d="M9 17c-3-1-5-3-6-6 0 4 0 8 0 12 1-3 3-5 6-6z"/><path class="ln" d="M17 24c-1 3 0 5 2 6M12 20c3 1 7 1 10 0M23 9c0-2 1-3 2-4M22 9c0-2-1-3-2-4"/><circle class="knot" cx="24" cy="15" r="1.3"/>',tail:[3,23],crown:[16,4]},
  shark:{body:'<path class="fill" d="M5 17c4-4 9-6 15-6 4 0 8 2 10 6-2 4-6 6-10 6-6 0-11-2-15-6z"/><path class="fill" d="M13 12c1-4 3-6 5-7 0 3 0 5-1 7z"/><path class="st" d="M5 17c4-4 9-6 15-6 4 0 8 2 10 6-2 4-6 6-10 6-6 0-11-2-15-6z"/><path class="st" d="M13 12c1-4 3-6 5-7 0 3 0 5-1 7zM5 17c-2-3-3-5-3-8 2 2 4 4 6 5M5 17c-2 3-3 5-3 8 2-2 4-4 6-5"/><path class="ln" d="M22 15v4M24 15v4M18 22c1 2 2 3 3 3"/><circle class="knot" cx="26" cy="16" r="1.2"/>',tail:[2,25]},
  seahorse:{body:'<path class="fill" d="M18 4c4 0 6 3 6 7 0 5-4 8-6 12-1 3 0 5 2 6-4 0-7-3-6-7 1-4 5-7 5-11 0-2-1-3-2-3-2 0-3 1-4 2l-4-1c1-3 5-5 9-5z"/><path class="st" d="M18 4c4 0 6 3 6 7 0 5-4 8-6 12-1 3 0 5 2 6-4 0-7-3-6-7 1-4 5-7 5-11 0-2-1-3-2-3-2 0-3 1-4 2l-4-1c1-3 5-5 9-5z"/><path class="ln" d="M9 9h-4M22 8l2-2M23 12l3-1M20 16l3 1M16 22h3"/><circle class="knot" cx="18" cy="8" r="1.2"/>',tail:[20,29]},
  octopus:{body:'<circle class="fill" cx="16" cy="12" r="8"/><circle class="st" cx="16" cy="12" r="8"/><path class="ln" d="M9 18c-2 4-4 7-2 11M13 19c-1 4-1 8 1 11M19 19c1 4 1 8-1 11M23 18c2 4 4 7 2 11"/><circle class="knot" cx="13" cy="12" r="1.2"/><circle class="knot" cx="19" cy="12" r="1.2"/>',tail:[27,22]},
  turtle:{body:'<ellipse class="fill" cx="15" cy="17" rx="10" ry="7"/><circle class="fill" cx="27" cy="15" r="3"/><ellipse class="st" cx="15" cy="17" rx="10" ry="7"/><circle class="st" cx="27" cy="15" r="3"/><path class="ln" d="M8 17h14M11 12l2 5M19 12l-2 5M11 22l2-5M19 22l-2-5M8 12l-4-3M8 22l-4 3M22 22l3 3"/><circle class="knot" cx="28" cy="14" r="1"/>',tail:[4,17]},
  jellyfish:{body:'<path class="fill" d="M6 15a10 8 0 0 1 20 0c-3 2-7 3-10 3s-7-1-10-3z"/><path class="st" d="M6 15a10 8 0 0 1 20 0c-3 2-7 3-10 3s-7-1-10-3z"/><path class="ln" d="M10 18c-1 4 1 7 0 11M14 19c-1 4 1 7 0 10M18 19c1 4-1 7 0 10M22 18c1 4-1 7 0 11M10 12c2-2 10-2 12 0"/><circle class="knot" cx="13" cy="14" r="1"/><circle class="knot" cx="19" cy="14" r="1"/>',tail:[26,16]},
  fish:{body:'<ellipse class="fill" cx="15" cy="16" rx="9" ry="6"/><path class="fill" d="M6 16l-4-5v10z"/><ellipse class="st" cx="15" cy="16" rx="9" ry="6"/><path class="st" d="M6 16l-4-5v10zM14 10c1-3 3-4 5-4-1 2-1 4-2 5z"/><path class="ln" d="M12 11v10M16 11v10M15 22c1 2 3 3 4 3"/><circle class="knot" cx="20" cy="15" r="1.2"/>',tail:[24,17]},
  crab:{body:'<ellipse class="fill" cx="16" cy="18" rx="9" ry="6"/><circle class="fill" cx="5" cy="12" r="3"/><circle class="fill" cx="27" cy="12" r="3"/><ellipse class="st" cx="16" cy="18" rx="9" ry="6"/><circle class="st" cx="5" cy="12" r="3"/><circle class="st" cx="27" cy="12" r="3"/><path class="ln" d="M8 14l-2-1M24 14l2-1M8 20l-4 3M9 22l-3 4M24 20l4 3M23 22l3 4M12 12v-3M20 12v-3"/><circle class="knot" cx="12" cy="9" r="1.2"/><circle class="knot" cx="20" cy="9" r="1.2"/>',tail:[24,24]},
};
const SHAPE_ORDER=Object.keys(SHAPES).filter(s=>s!=='whale');
const HUES={accent:'--accent',teal:'--crew-teal',sky:'--crew-sky',berry:'--crew-berry',olive:'--crew-olive',slate:'--crew-slate'};
// Identity hues only. accent is Wright's alone; semantic tokens (ok, attention, danger, parked) mean kernel state and are never used here (scripts/check-docs.sh enforces it).
const CREW_HUES=['teal','berry','sky','olive','slate'];
const seedOf=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return (h%40)/10};
function avatarHTML(a,state,size,title){
  state=state||agentState(a.id); size=size||32;
  const key=a.id==='wright'?'whale':(a.shape in SHAPES?a.shape:'fish'); const sh=SHAPES[key]; const [tx,ty]=sh.tail;
  const label=`${a.name} · ${stateWord[state]||state}${title?' · '+title:''}`;
  const tails=`<g class="tail" style="transform-origin:${tx}px ${ty}px"><path class="t t-idle" d="M${tx} ${ty}c-3 1-5 3-4 7"/><path class="t t-up" d="M${tx} ${ty}c-5-1-7-6-3-9 3-2 5 2 2 3"/><path class="t t-slack" d="M${tx} ${ty}c-1 3-1 8 0 12"/><path class="t t-cut" d="M${tx} ${ty}c-2 0-3 1-3 2"/><path class="t t-cut2" d="M${tx-5} ${ty+5}c-1 1-2 3-1 5"/><path class="t t-bow" d="M${tx} ${ty}c-3-3-6-2-4 1s5 0 4-1c1-3 5-2 3 1s-5 0-3-1"/></g>`;
  const crown=a.id==='wright'?`<path class="crown" d="M${sh.crown[0]-6.5} ${sh.crown[1]+4.5}l1.5-5 3 3 2-4.5 2 4.5 3-3 1.5 5z"/>`:'';
  return `<span class="bot ${state} ${a.id==='wright'?'lead':''}" style="--s:${size}px;--bot:var(${HUES[a.hue]||(a.id==='wright'?HUES.accent:HUES.slate)});--seed:-${seedOf(a.id)}s" role="img" aria-label="${esc(label)}" title="${esc(label)}"><span class="ring" aria-hidden="true"></span><svg viewBox="-2 -2 36 36"><circle class="stitch" cx="16" cy="16" r="16.5"/><g class="drift"><g class="rig">${sh.body}${crown}${tails}</g></g></svg></span>`;
}

  const cell=(a,st,size,label)=>`<div>${avatarHTML(a,st,size)}<span>${label}</span></div>`;
  const ST=[['idle','idle'],['working','working'],['waiting','waiting on you'],['parked','paused at cap'],['done','done'],['danger','killed']];
  document.getElementById('states').innerHTML=ST.map(s=>cell({id:'wright',name:'Wright',shape:'whale',hue:'accent'},s[0],56,'Wright · '+s[1])).join('')+ST.map(s=>cell({id:'mason',name:'Mason',shape:'shark',hue:'teal'},s[0],56,'Mason · '+s[1])).join('');
  const hues=CREW_HUES;
  document.getElementById('shapes').innerHTML=SHAPE_ORDER.map((s,i)=>cell({id:'x'+i,name:s,shape:s,hue:hues[i%5]},'idle',44,s)).join('');
  document.getElementById('sizes').innerHTML=[16,18,24,36].map(z=>cell({id:'m',name:'Mason',shape:'shark',hue:'teal'},'working',z,z+'px')).join('');
</script>
