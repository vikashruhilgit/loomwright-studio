<!-- @dsCard group="Actions" height=340 subtitle="⌘K: screens, actions and entities in one list, with shortcuts" -->
<style>
  body{margin:0;padding:16px;background:var(--ground);font-family:var(--font-sans);color:var(--ink);font-size:13px;line-height:18px}
  .pal{width:560px;max-width:100%;background:var(--surface-raised);border-radius:var(--radius-lg);box-shadow:var(--shadow-3);overflow:hidden}
  .in{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-bottom:1px solid var(--hairline)}
  .in input{flex:1;border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);outline:0}
  .in input::placeholder{color:var(--ink-tertiary)}
  .kbd{font-family:var(--font-mono);font-size:11px;font-weight:500;padding:1px 5px;border-radius:4px;background:var(--surface-sunken);border:1px solid var(--hairline);color:var(--ink-tertiary)}
  .list{padding:6px}
  .grp{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-tertiary);padding:8px 10px 4px}
  .it{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:var(--radius-sm);color:var(--ink)}
  .it.sel{background:var(--accent-soft);color:var(--accent)}
  .it .r{margin-left:auto;display:flex;gap:4px;align-items:center}
  .it .m{color:var(--ink-tertiary);font-size:12px}
  .it.sel .m{color:var(--accent);opacity:.8}
  .foot{display:flex;gap:16px;padding:8px 14px;border-top:1px solid var(--hairline);font-size:11px;color:var(--ink-tertiary);background:var(--surface)}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
<div class="pal" role="combobox" aria-expanded="true" aria-haspopup="listbox" aria-owns="pl">
  <div class="in"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input aria-label="Command" value="rev" aria-controls="pl" aria-activedescendant="i1"><span class="kbd">Esc</span></div>
  <div class="list" id="pl" role="listbox">
    <div class="grp">Actions</div>
    <div class="it sel" role="option" id="i1" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/></svg>Review approval: Mason · post review on #412<span class="r"><span class="m">waiting on you</span><span class="kbd">⏎</span></span></div>
    <div class="it" role="option"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New duty: review PRs…<span class="r"><span class="kbd">⌘N</span></span></div>
    <div class="grp">Playbooks</div>
    <div class="it" role="option"><span class="dot" style="background:var(--ok)"></span>Review PRs where I'm requested<span class="r"><span class="m">on · ran 2 min ago</span></span></div>
    <div class="it" role="option"><span class="dot" style="background:var(--attention)"></span>Triage review comments<span class="r"><span class="m">on · waiting on you</span></span></div>
    <div class="grp">Sessions</div>
    <div class="it" role="option"><span class="dot" style="background:var(--working)"></span>Mason · review PR #412<span class="r"><span class="m">4m 12s</span><span class="kbd">⌘4</span></span></div>
  </div>
  <div class="foot"><span><span class="kbd">↑↓</span> move</span><span><span class="kbd">⏎</span> open</span><span><span class="kbd">⌘⏎</span> open in inspector</span><span style="margin-left:auto">Wright, powered by Claude</span></div>
</div>
